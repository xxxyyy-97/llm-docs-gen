[project]
name = "llm-docs-gen"
version = "0.1.0"
description = "Генератор markdown-документации для LLM из декларативного docs.yml"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "xxxyyy-97", email = "102466004+xxxyyy-97@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ruamel-yaml>=0.18",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "typer>=0.15",
]

[project.scripts]
llm-docs-gen = "llm_docs_gen.cli:app"

[project.urls]
Homepage = "https://github.com/xxxyyy-97/llm-docs-gen"
Repository = "https://github.com/xxxyyy-97/llm-docs-gen"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

